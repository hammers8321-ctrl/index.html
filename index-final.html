<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albion Craft Scout</title><style>body{margin:0;background:#0d1117;color:#e6edf3;font:14px Arial}main{max-width:900px;margin:auto;padding:12px}.c{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin:10px 0}h1{font-size:22px}h2{font-size:17px}input,select,button{width:100%;padding:11px;margin:4px 0;box-sizing:border-box;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:8px}button{background:#238636;border:0;font-weight:bold}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.muted{color:#8b949e;font-size:12px}.good{color:#3fb950;font-weight:bold}.bad{color:#f85149;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #30363d;text-align:left}.item{padding:9px;border:1px solid #30363d;border-radius:8px;margin:6px 0;cursor:pointer}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><main>
<div class=c><h1>⚒️ Albion Craft Scout</h1><div class=muted>Ricette, prezzi di mercato, profitto e Focus.</div></div>
<div class=c><h2>Impostazioni</h2><div class=g><div><label>Server</label><select id=server><option value=europe>Europe</option><option value=west>West</option><option value=east>East</option></select></div><div><label>Città</label><select id=city><option>Bridgewatch</option><option>Caerleon</option><option>Fort Sterling</option><option>Lymhurst</option><option>Martlock</option><option>Thetford</option><option>Brecilien</option></select></div><div><label>Quantità</label><input id=qty type=number value=1 min=1></div><div><label>Tax vendita %</label><input id=tax type=number value=4 step=.1></div><div><label>Return rate %</label><input id=rrr type=number value=0 step=.1></div><div><label>Focus disponibile</label><input id=focus type=number value=10000></div></div></div>
<div class=c><h2>Cerca ricetta</h2><input id=q placeholder="Es. T6_BAG, BAG, SWORD, AXE"><button onclick=search()>CERCA</button><div id=status class=muted></div><div id=results></div></div>
<div class=c id=work style="display:none"><h2 id=name></h2><div id=recipe></div><button onclick=run()>AGGIORNA PREZZI E CALCOLA</button><div id=out></div></div>
</main><script>
const H={europe:'https://europe.albion-online-data.com',west:'https://west.albion-online-data.com',east:'https://east.albion-online-data.com'};let db=null,cur=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>Number(x||0).toLocaleString('it-IT',{maximumFractionDigits:0})+' s';
async function load(){if(db)return db;let u='https://raw.githubusercontent.com/vkorne-web/albion-market/main/recipes.json';let r=await fetch(u);if(!r.ok)throw Error('catalogo ricette non raggiungibile');db=await r.json();return db}
async function search(){let q=document.getElementById('q').value.trim().toUpperCase();if(!q)return;status.textContent='Caricamento ricette...';results.innerHTML='';try{let d=await load(),ids=Object.keys(d).filter(x=>x.includes(q));if(!ids.length){status.textContent='Nessuna ricetta trovata.';return}status.textContent=ids.length+' risultati';results.innerHTML=ids.slice(0,50).map(id=>`<div class=item onclick="pick('${id.replace(/'/g,"\\'")}')"><b>${esc(id)}</b><br><span class=muted>${d[id].materials.length} materiali${d[id].city?' • bonus città '+esc(d[id].city):''}</span></div>`).join('')}catch(e){status.textContent='Errore: '+e.message}}
async function pick(id){cur={id,rec:db[id]};work.style.display='block';name.textContent='⚒️ '+id;recipe.innerHTML='<b>Materiali:</b> '+cur.rec.materials.map(m=>`<span>${esc(m.id)} × ${m.count}</span>`).join(' • ')+(cur.rec.city?`<div class=muted>Bonus città: ${esc(cur.rec.city)}</div>`:'');await run()}
async function prices(ids,locs){let host=H[server.value],u=host+'/api/v2/stats/prices/'+ids.join(',')+'.json?locations='+encodeURIComponent(locs)+'&qualities=1';let r=await fetch(u);if(!r.ok)throw Error('API prezzi HTTP '+r.status);return r.json()}
async function run(){try{let ids=[cur.id,...cur.rec.materials.map(m=>m.id)],data=await prices(ids,city.value),m={};data.forEach(x=>{if(x.city===city.value)m[x.item_id]=x});let cost=0,rows='';for(let x of cur.rec.materials){let p=m[x.id]?.sell_price_min||0;cost+=p*x.count;rows+=`<tr><td>${esc(x.id)}</td><td>${x.count}</td><td>${p?money(p):'—'}</td><td>${p?money(p*x.count):'—'}</td></tr>`}let sell=m[cur.id]?.sell_price_min||0,q=+qty.value||1,t=+tax.value||0,rr=+rrr.value||0;cost*=q*(1-rr/100);let rev=sell*q*(1-t/100),profit=rev-cost;out.innerHTML=`<table><tr><th>Materiale</th><th>Qtà</th><th>Prezzo</th><th>Costo</th></tr>${rows}</table><br><table><tr><td>Costo materiali</td><td>${money(cost)}</td></tr><tr><td>Vendita netta</td><td>${money(rev)}</td></tr><tr><td>Profitto</td><td class=${profit>=0?'good':'bad'}>${money(profit)}</td></tr><tr><td>ROI</td><td>${cost?(profit/cost*100).toFixed(1):0}%</td></tr><tr><td>Prezzo vendita ${esc(city.value)}</td><td>${sell?money(sell):'non disponibile'}</td></tr></table><div class=muted style="margin-top:8px">Il Focus esatto dipende dalla ricetta e dalla specializzazione del personaggio. Non viene inventato: va letto dai dati di ricetta disponibili.</div>`}catch(e){out.innerHTML='<div class=bad>Errore: '+esc(e.message)+'</div>'}}
</script></body></html>
