<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albion Craft Scout</title><style>body{font-family:Arial;background:#0d1117;color:#eee;margin:0;padding:14px}main{max-width:900px;margin:auto}.c{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin:10px 0}input,select,button{padding:11px;border-radius:8px;background:#0d1117;color:#eee;border:1px solid #30363d;width:100%;box-sizing:border-box}button{background:#58a6ff;color:#111;font-weight:bold}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.r{display:flex;gap:8px}.item{padding:10px;border:1px solid #30363d;border-radius:8px;margin-top:7px;cursor:pointer}.muted{color:#9aa4af;font-size:12px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #30363d;text-align:left}.ok{color:#3fb950}@media(max-width:650px){.g{grid-template-columns:1fr}.r{flex-direction:column}}</style></head><body><main><div class="c"><h1>⚒️ Albion Craft Scout</h1><div class="muted">Ricette dal Game Info API + prezzi live Albion Online Data Project.</div></div><div class="c"><div class="g"><div><label>Server</label><select id="sv"><option value="europe">Europe</option><option value="west">West</option><option value="east">East</option></select></div><div><label>Città</label><select id="city"><option>Bridgewatch</option><option>Caerleon</option><option>Fort Sterling</option><option>Lymhurst</option><option>Martlock</option><option>Thetford</option><option>Brecilien</option></select></div><div><label>Quantità</label><input id="qty" type="number" value="1" min="1"></div><div><label>Tax %</label><input id="tax" type="number" value="4" min="0"></div><div><label>Return rate %</label><input id="rrr" type="number" value="0" min="0" max="100"></div><div><label>Focus disponibile</label><input id="focus" type="number" value="10000" min="0"></div></div></div><div class="c"><h2>Cerca qualsiasi oggetto</h2><div class="r"><input id="q" placeholder="Bag, sword, greataxe, T6_BAG..."><button onclick="search()">CERCA</button></div><div id="msg" class="muted"></div><div id="res"></div></div><div class="c" id="detail" style="display:none"><h2 id="nm"></h2><div id="recipe"></div><button onclick="prices()">AGGIORNA PREZZI</button><div id="out"></div></div></main><script>
const G="https://gameinfo.albiononline.com/api/gameinfo",H={europe:"https://europe.albion-online-data.com",west:"https://west.albion-online-data.com",east:"https://east.albion-online-data.com"};let item=null,rec=null;
const money=x=>Number(x||0).toLocaleString("it-IT",{maximumFractionDigits:0})+" s";
async function search(){let q=document.getElementById("q").value.trim();if(!q)return;msg("Cerco nel catalogo completo...");res.innerHTML="";try{let a=await fetch(G+"/items/search?search="+encodeURIComponent(q)+"&limit=50").then(x=>x.json());if(!Array.isArray(a)||!a.length){msg("Nessun risultato.");return}msg(a.length+" risultati.");res.innerHTML=a.map(x=>{let id=x.UniqueName||x.Index||"",n=x.LocalizedNames?.["EN-US"]||id;return '<div class=item onclick="pick('+JSON.stringify(id)+','+JSON.stringify(n)+')"><b>'+n+'</b><br><span class=muted>'+id+'</span></div>'}).join("")}catch(e){msg("Errore: "+e.message)}}
async function pick(id,n){item={id,n};detail.style.display="block";nm.textContent="⚒️ "+n;recipe.innerHTML="Carico ricetta...";try{let d=await fetch(G+"/items/"+encodeURIComponent(id)+"/data").then(x=>x.json());rec=d.craftingRequirements||d.CraftingRequirements;if(typeof rec==="string")rec=JSON.parse(rec);if(!rec?.craftResourceList){recipe.innerHTML="Questo oggetto non espone una ricetta craftabile.";return}recipe.innerHTML="<b>Materiali:</b> "+rec.craftResourceList.map(m=>'<span>'+m.uniqueName+" × "+m.count+"</span> ").join("")+"<br><span class=muted>Focus base: "+(rec.craftingFocus||0)+" • Fee: "+money(rec.silver||0)+"</span>";prices()}catch(e){recipe.textContent="Errore ricetta: "+e.message}}
async function prices(){if(!rec)return;let mats=rec.craftResourceList||[],ids=[item.id,...mats.map(m=>m.uniqueName)],city=document.getElementById("city").value;try{let u=H[sv.value]+"/api/v2/stats/prices/"+ids.map(encodeURIComponent).join(",")+".json?locations="+encodeURIComponent(city)+"&qualities=1",a=await fetch(u).then(x=>x.json()),m={};a.forEach(x=>m[x.item_id]=x);let cost=Number(rec.silver||0);let rows=mats.map(x=>{let p=m[x.uniqueName]?.sell_price_min||0;cost+=p*x.count*(1-(Number(rrr.value)||0)/100);return "<tr><td>"+x.uniqueName+"</td><td>"+x.count+"</td><td>"+(p?money(p):"—")+"</td></tr>"}).join("");let sell=m[item.id]?.sell_price_min||0,q=Number(qty.value)||1,t=Number(tax.value)||0,total=cost*q,revenue=sell*q*(1-t/100),profit=revenue-total,focus=(Number(rec.craftingFocus)||0)*q;out.innerHTML="<table><tr><th>Materiale</th><th>Qtà</th><th>Sell</th></tr>"+rows+"</table><p>Costo/pezzo: <b>"+money(cost)+"</b><br>Vendita: <b>"+money(sell)+"</b><br>Profitto totale: <b class=ok>"+money(profit)+"</b><br>Focus base: <b>"+focus.toLocaleString("it-IT")+"</b><br>Silver/Focus: <b>"+(focus?money(profit/focus):"—")+"</b></p>"}catch(e){out.textContent="Errore prezzi: "+e.message}}
function msg(x){document.getElementById("msg").textContent=x}
</script></body></html>
